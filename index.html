    <meta name="theme-color" content="#fafafa" />

    <meta name="description" content="{{PAGE_DESCRIPTION}}" />

    <meta property="og:image" content="{{IMAGE_URL}}" />
    <meta property="og:image:type" content="image/png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- If this script changes, update its sha256 hash in the vercel.json Content-Security-Policy (npm test checks this). -->
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('portfolio-theme');
          const savedTheme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : null;
          const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          const theme = savedTheme || systemTheme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0a0c10' : '#fafafa';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
